name: Tarih Kontrolü – Kapanan Programları Güncelle

on:
  schedule:
    # Her gece 02:00 UTC (Türkiye 05:00) çalışır
    - cron: '0 2 * * *'
  workflow_dispatch: # Manuel tetikleme de mümkün

jobs:
  check-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tarihleri kontrol et ve güncelle
        run: node scripts/check-dates.js

      - name: Değişiklik varsa commit at
        run: |
          git config user.name "Hibe Motor Bot"
          git config user.email "bot@corlutso.org.tr"
          git add data.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
          else
            TARIH=$(date '+%d.%m.%Y')
            git commit -m "🤖 Otomatik güncelleme: $TARIH tarihinde kapanan programlar işaretlendi"
            git push
          fi

      # check-dates.js'in kendi içinde e-posta gönderme mekanizması yok
      # (her gece çalıştığı için başarılı sonuçlarda e-posta atmak gürültü
      # yaratır). Ama BAŞARISIZ olursa (örn. data.json bozuksa, script
      # istisna fırlatırsa) bunu bilmek gerekiyor — bu yüzden sadece hata
      # durumunda tetiklenen bağımsız bir bildirim.
      - name: Başarısızlık bildirimi gönder (son çare)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BILDIRIM_EMAIL: ${{ secrets.BILDIRIM_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$BILDIRIM_EMAIL" ]; then
            echo "RESEND_API_KEY veya BILDIRIM_EMAIL tanımlı değil, bildirim atlanıyor."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Hibe Motor Bot <bot@corlutso.org.tr>\",\"to\":[\"$BILDIRIM_EMAIL\"],\"subject\":\"🔴 Hibe Motoru: gecelik tarih kontrolü BAŞARISIZ oldu\",\"html\":\"<p>Gecelik tarih kontrolü (check-dates.yml) workflow'u tamamlanamadı.</p><p><a href='$RUN_URL'>Çalıştırma kaydını gör →</a></p>\"}"
