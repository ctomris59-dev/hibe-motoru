name: AI Agent İlan Tarama ve Veritabanı Güncelleme

on:
  schedule:
    # Her Pazartesi Türkiye saati ile sabah 09:00'da çalışır
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manuel tetikleme butonu sağlar

jobs:
  ai-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: |
          cd scripts
          npm install

      - name: AI Agent ile Siteleri Tara ve Analiz Et
        run: |
          cd scripts
          node scraper.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Değişiklikleri Algıla ve Push Et
        run: |
          git config user.name "Çorlu TSO AI Agent"
          git config user.email "ai-bot@corlutso.org.tr"
          git add data.json
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik tespit edilemedi."
          else
            git commit -m "🤖 AI Agent: Yeni açık ilanlar veritabanına otomatik eklendi"
            git push
          fi

      # Bu adım SADECE önceki adımlardan biri başarısız olursa çalışır
      # (örn. npm install patlarsa, scraper.js process.exit(1) ile çökerse).
      # scraper.js kendi içindeki catch bloğu da bir e-posta denemesi yapar,
      # ama script'in KENDİSİ çalışamayacak kadar bozulmuşsa (örn. Node
      # kurulamadıysa) o kod hiç çalışmaz — bu adım workflow seviyesinde,
      # scripte hiç bağımlı olmayan bağımsız bir son çare bildirimidir.
      - name: Başarısızlık bildirimi gönder (son çare)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BILDIRIM_EMAIL: ${{ secrets.BILDIRIM_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$BILDIRIM_EMAIL" ]; then
            echo "RESEND_API_KEY veya BILDIRIM_EMAIL tanımlı değil, bildirim atlanıyor."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Hibe Motor Bot <bot@corlutso.org.tr>\",\"to\":[\"$BILDIRIM_EMAIL\"],\"subject\":\"🔴 Hibe Motoru: haftalık tarama workflow'u BAŞARISIZ oldu\",\"html\":\"<p>Haftalık tarama (weekly-scrape.yml) workflow'u tamamlanamadı — muhtemelen npm kurulumu, Node çalıştırma veya git push adımlarından biri patladı (scraper.js'in kendi hata e-postası bu durumda hiç gönderilmemiş olabilir).</p><p><a href='$RUN_URL'>Çalıştırma kaydını gör →</a></p>\"}"
